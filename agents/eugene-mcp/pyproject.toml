[project]
name = "eugene-mcp"
version = "0.1.0"
description = "MCP wrapper for the EUGENE knowledge graph webservice"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "black>=25.12.0",
    "boto3>=1.42.37",
    "fastmcp<=3.0.0b1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.25.0",
    "python-dotenv>=1.2.1",
]

[tool.black]
    line-length = 88
