[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eugene-agentcore-supervisor"
version = "0.1.0"
description = "Lightweight Amazon Bedrock AgentCore gateway to the existing Eugene Agent"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]